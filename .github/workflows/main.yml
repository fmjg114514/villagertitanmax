name: Build VillagerTitan

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0

      - name: Build
        id: build
        run: gradle build --no-daemon --stacktrace

      - name: Probe real versions (runs even if build failed)
        if: always()
        run: |
          echo "=== fabric-loom 可用版本 (尾部) ==="
          curl -s https://maven.fabricmc.net/net/fabricmc/fabric-loom/fabric-loom.gradle.plugin/maven-metadata.xml \
            | grep -o '<version>[^<]*' | sed 's/<version>//' | tail -25
          echo "=== fabric-api 含 26.3 的版本 (尾部) ==="
          curl -s https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml \
            | grep -o '<version>[^<]*' | sed 's/<version>//' | grep '26.3' | tail -15
          echo "=== geckolib-fabric-26.3 可用版本 ==="
          curl -s "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/software/bernie/geckolib/geckolib-fabric-26.3/maven-metadata.xml" \
            | grep -o '<version>[^<]*' | sed 's/<version>//' | tail -15
          echo "=== fabric-loader 版本 (尾部) ==="
          curl -s https://maven.fabricmc.net/net/fabricmc/fabric-loader/maven-metadata.xml \
            | grep -o '<version>[^<]*' | sed 's/<version>//' | tail -15

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: villagertitan-jar
          path: build/libs/*.jar
          if-no-files-found: warn

